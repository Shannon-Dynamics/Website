<!DOCTYPE html>

    <title>Probabilistic Robotics via Rust — Books — Shannon Dynamics</title>

    <!-- ═══════════════════════════════════════════════════════════════════
         This page used to be the book. It is now the interactive edition's
         front door.

         The book lives at books/probabilistic-robotics-via-rust/ — a real
         directory of pages, one per chapter, so every chapter has its own URL
         to link, share and bookmark. This file stays behind because the URL is
         linked from the site and may be linked from outside it; it forwards,
         and offers the PDF for anyone who wants the book on paper instead.

         Three redirects, deliberately: the meta refresh fires without
         scripting, the script fires sooner and leaves no extra history entry,
         and the visible link covers the case where both are blocked.
         ═══════════════════════════════════════════════════════════════════ -->
    <link rel="canonical" href="books/probabilistic-robotics-via-rust/" />
    <meta http-equiv="refresh" content="0; url=books/probabilistic-robotics-via-rust/" />
    <script>location.replace("books/probabilistic-robotics-via-rust/" + location.hash);</script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
